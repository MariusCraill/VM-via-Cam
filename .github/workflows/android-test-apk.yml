# Builds an installable debug APK of the web app (Capacitor wrapper) for testing on a phone.
# The APK bundles the front end only: barcode scanning and photo capture work offline,
# but anything that calls the server (/api/...: Gemini OCR, saving visitors) does not.
name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-fa8hzd]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web app
        run: npx vite build

      - name: Create Android project
        run: |
          echo '{"appId":"com.gatepass.vmviacam.prtest","appName":"GatePass PR test","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gatepass-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # A pre-release gives a direct APK download link that opens on a phone.
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gatepass-test.apk
          gh release delete test-apk --yes --cleanup-tag || true
          gh release create test-apk gatepass-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "Test APK (${GITHUB_REF_NAME})" \
            --notes "Debug build of ${GITHUB_SHA::7} for phone testing. Barcode scanning and photo capture work; OCR and saving visitors need the server and won't work in this APK."
